name: Agent task
description: Submit a task for AI Agent Manager
title: "[AAM] "
labels: ["aam:run"]
body:
  - type: markdown
    attributes:
      value: |
        The task text is treated as untrusted input. Agents provide advisory plans only.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the desired outcome, constraints, and acceptance criteria.
      placeholder: "Analyze this project and propose a test plan..."
    validations:
      required: true
